<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Faultline: one block sheared along a stepped fault, the two plates slipped
       past each other. The gap shows the page behind it, so the crack tracks
       the viewer's light/dark theme. -->
  <clipPath id="rounded"><rect width="32" height="32" rx="7"/></clipPath>
  <g clip-path="url(#rounded)">
    <path d="M0 0 H19 V9 H14 V19 H20 V30 H15 V32 H0 Z" fill="#8b5cf6"/>
    <path d="M21 0 H32 V32 H17 V30 H22 V19 H16 V9 H21 Z" fill="#6d28d9"/>
  </g>
</svg>
